<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureChat - Dashboard Obrolan Teman</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased h-screen flex flex-col overflow-hidden">

    <!-- ================= SECTION: HALAMAN LOGIN / NAMA PENGGUNA ================= -->
    <div id="login-section" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="inline-block bg-emerald-500/10 text-emerald-400 p-3 rounded-2xl border border-emerald-500/20 mb-2">
                    <i class="fa-solid fa-comments text-2xl"></i>
                </div>
                <h2 class="text-xl font-bold tracking-tight">Masuk ke Ruang Chat</h2>
                <p class="text-xs text-slate-400">Masukkan nama panggilan Anda untuk mulai mengobrol.</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">Nama Anda</label>
                    <input type="text" id="username-input" required placeholder="Contoh: Budi, Siska..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-semibold py-2.5 rounded-xl text-xs transition cursor-pointer">
                    Mulai Chatting
                </button>
            </form>
        </div>
    </div>


    <!-- ================= SECTION: DASHBOARD CHAT UTAMA ================= -->
    <div id="chat-dashboard" class="hidden flex flex-col h-full w-full max-w-5xl mx-auto border-x border-slate-800 bg-slate-900 shadow-2xl">
        
        <!-- Header Chat -->
        <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center z-10">
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <div class="w-10 h-10 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center font-bold">
                        <i class="fa-solid fa-user-group"></i>
                    </div>
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
                </div>
                <div>
                    <h2 class="text-sm font-bold">Grup Obrolan Sahabat</h2>
                    <p class="text-[10px] text-emerald-400 flex items-center gap-1">Online &bull; <span id="current-user-display" class="font-semibold"></span></p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <button onclick="clearChat()" class="text-xs bg-slate-800 hover:bg-rose-500/10 text-slate-400 hover:text-rose-400 border border-slate-700 hover:border-rose-500/30 px-3 py-1.5 rounded-lg transition cursor-pointer" title="Hapus Riwayat Chat">
                    <i class="fa-solid fa-trash-can mr-1"></i> Bersihkan
                </button>
                <button onclick="handleLogout()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-lg transition cursor-pointer">
                    Ganti Nama
                </button>
            </div>
        </header>

        <!-- Area Pesan (Chat Box) -->
        <div id="chat-messages" class="flex-grow p-4 md:p-6 overflow-y-auto space-y-4 bg-slate-950/50">
            <!-- Pesan akan masuk secara dinamis di sini -->
        </div>

        <!-- Form Kirim Pesan -->
        <footer class="bg-slate-900 border-t border-slate-800 p-4">
            <form onsubmit="sendMessage(event)" class="flex gap-2">
                <input type="text" id="message-input" required placeholder="Tulis pesan ke teman..." class="flex-grow bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-semibold px-5 py-3 rounded-xl text-xs transition flex items-center justify-center cursor-pointer">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </footer>

    </div>


    <!-- ================= SCRIPT LOGIKA CHAT ================= -->
    <script>
        let currentUser = "";

        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('chat_username');
            if (savedUser) {
                currentUser = savedUser;
                showDashboard();
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const nameInput = document.getElementById('username-input').value.trim();
            if (nameInput) {
                currentUser = nameInput;
                localStorage.setItem('chat_username', currentUser);
                showDashboard();
            }
        }

        function showDashboard() {
            document.getElementById('login-section').classList.add('hidden');
            const dashboard = document.getElementById('chat-dashboard');
            dashboard.classList.remove('hidden');
            dashboard.classList.add('flex');
            document.getElementById('current-user-display').innerText = currentUser;
            
            renderMessages();
            // Cek pesan baru secara otomatis setiap 1 detik dari localStorage
            setInterval(renderMessages, 1000);
        }

        function handleLogout() {
            localStorage.removeItem('chat_username');
            location.reload();
        }

        // Kirim Pesan
        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const timeNow = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            const newMessage = {
                sender: currentUser,
                text: text,
                time: timeNow
            };

            // Ambil riwayat chat lama dari localStorage
            let messages = JSON.parse(localStorage.getItem('chat_history')) || [];
            messages.push(newMessage);
            localStorage.setItem('chat_history', JSON.stringify(messages));

            input.value = '';
            renderMessages();
        }

        // Tampilkan Pesan ke Layar
        function renderMessages() {
            const chatContainer = document.getElementById('chat-messages');
            const messages = JSON.parse(localStorage.getItem('chat_history')) || [];
            
            // Cek apakah user sedang berada di bawah agar scroll otomatis pas ada pesan baru
            const isAtBottom = chatContainer.scrollHeight - chatContainer.scrollTop <= chatContainer.clientHeight + 50;

            let htmlContent = '';
            if (messages.length === 0) {
                htmlContent = `<div class="text-center text-slate-500 text-xs my-auto py-12"><i class="fa-regular fa-comments text-2xl mb-2"></i><p>Belum ada percakapan. Mulai sapa teman Anda!</p></div>`;
            } else {
                messages.forEach(msg => {
                    const isMe = msg.sender === currentUser;
                    if (isMe) {
                        // Pesan Milik Sendiri (Kanan)
                        htmlContent += `
                            <div class="flex flex-col items-end space-y-1">
                                <span class="text-[10px] text-slate-500 px-1">Anda</span>
                                <div class="bg-emerald-600 text-slate-950 font-medium px-4 py-2.5 rounded-2xl rounded-tr-none max-w-xs md:max-w-md text-xs shadow-md">
                                    ${escapeHtml(msg.text)}
                                </div>
                                <span class="text-[9px] text-slate-500 px-1">${msg.time}</span>
                            </div>
                        `;
                    } else {
                        // Pesan dari Teman (Kiri)
                        htmlContent += `
                            <div class="flex flex-col items-start space-y-1">
                                <span class="text-[10px] text-emerald-400 font-semibold px-1">${escapeHtml(msg.sender)}</span>
                                <div class="bg-slate-900 border border-slate-800 text-slate-100 px-4 py-2.5 rounded-2xl rounded-tl-none max-w-xs md:max-w-md text-xs shadow-md">
                                    ${escapeHtml(msg.text)}
                                </div>
                                <span class="text-[9px] text-slate-500 px-1">${msg.time}</span>
                            </div>
                        `;
                    }
                });
            }

            chatContainer.innerHTML = htmlContent;

            if (isAtBottom) {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        // Bersihkan Riwayat Chat
        function clearChat() {
            if (confirm("Yakin ingin menghapus seluruh riwayat obrolan?")) {
                localStorage.removeItem('chat_history');
                renderMessages();
            }
        }

        // Mencegah kode HTML injeksi berbahaya
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>

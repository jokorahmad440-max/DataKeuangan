<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dompet Keuangan Pribadi - Aman & Permanen</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Skrip untuk Mematikan F12, Klik Kanan, dan Shortcut Inspect Element -->
    <script>
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault(); // Matikan klik kanan
        });

        document.addEventListener('keydown', function(e) {
            // Matikan F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
            if (
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
                (e.ctrlKey && e.key === 'U')
            ) {
                e.preventDefault();
                alert('Akses inspeksi elemen dinonaktifkan.');
                return false;
            }
        });
    </script>

    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // --- GANTI BAGIAN INI DENGAN CONFIG FIREBASE ASLI ANDA ---
        const firebaseConfig = {
            apiKey: "MASUKKAN_API_KEY_ANDA",
            authDomain: "MASUKKAN_AUTH_DOMAIN_ANDA",
            projectId: "MASUKKAN_PROJECT_ID_ANDA",
            storageBucket: "MASUKKAN_STORAGE_BUCKET_ANDA",
            messagingSenderId: "MASUKKAN_MESSAGING_SENDER_ID_ANDA",
            appId: "MASUKKAN_APP_ID_ANDA"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        let currentUserEmail = "";

        // Pantau Status Login
        onAuthStateChanged(auth, (user) => {
            const loginScreen = document.getElementById('login-screen');
            const appScreen = document.getElementById('app-screen');
            
            if (user) {
                currentUserEmail = user.email;
                document.getElementById('user-info').innerText = `Login: ${currentUserEmail}`;
                loginScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                muatData();
            } else {
                loginScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
            }
        });

        // 1. Login Manual (Username vzqaajoko / pw 1)
        window.loginManual = async function() {
            const userInp = document.getElementById('username-inp').value.trim();
            const passInp = document.getElementById('pass-inp').value.trim();

            if (userInp === 'vzqaajoko' && passInp === '1') {
                try {
                    await signInWithEmailAndPassword(auth, 'vzqaajoko@app.com', '1');
                } catch (e) {
                    alert('Gagal login manual. Pastikan akun "vzqaajoko@app.com" dengan password "1" sudah dibuat di Firebase Authentication Anda.');
                }
            } else {
                alert('Username atau Password salah!');
            }
        }

        // 2. Login menggunakan Email Google
        window.loginGoogle = async function() {
            try {
                await signInWithPopup(auth, googleProvider);
            } catch (error) {
                alert('Login Google gagal: ' + error.message);
            }
        }

        // 3. Logout
        window.logoutApp = async function() {
            await signOut(auth);
        }

        // Format Rupiah
        window.formatRupiah = function(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        // Muat Data Khusus User yang Sedang Login
        async function muatData() {
            const elemenRiwayat = document.getElementById('riwayat-list');
            const elemenSaldo = document.getElementById('total-saldo');
            elemenRiwayat.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Memuat data...</p>';

            try {
                const q = query(collection(db, "transaksi"), where("user", "==", currentUserEmail));
                const querySnapshot = await getDocs(q);
                
                let totalSaldo = 0;
                let listTransaksi = [];

                querySnapshot.forEach((docSnap) => {
                    let data = docSnap.data();
                    data.id = docSnap.id;
                    listTransaksi.push(data);
                    
                    if (data.tipe === 'masuk') totalSaldo += Number(data.jumlah);
                    else totalSaldo -= Number(data.jumlah);
                });

                elemenSaldo.innerText = formatRupiah(totalSaldo);
                elemenRiwayat.innerHTML = '';

                if (listTransaksi.length === 0) {
                    elemenRiwayat.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Belum ada catatan keuangan.</p>';
                    return;
                }

                listTransaksi.forEach((item) => {
                    elemenRiwayat.innerHTML += `
                        <div class="flex justify-between items-center p-3 bg-slate-50 rounded-lg border border-slate-100 text-sm">
                            <div>
                                <p class="font-medium text-slate-700">${item.keterangan}</p>
                                <span class="text-xs ${item.tipe === 'masuk' ? 'text-emerald-600' : 'text-rose-600'} font-semibold">
                                    ${item.tipe === 'masuk' ? '+' : '-'} ${formatRupiah(item.jumlah)}
                                </span>
                            </div>
                            <button onclick="hapusTransaksi('${item.id}')" class="text-slate-400 hover:text-rose-600 text-xs">Hapus</button>
                        </div>
                    `;
                });

            } catch (error) {
                console.error(error);
                elemenRiwayat.innerHTML = '<p class="text-xs text-rose-500 text-center py-4">Gagal memuat data cloud.</p>';
            }
        }

        // Tambah Transaksi
        window.tambahTransaksi = async function(tipe) {
            const keterangan = document.getElementById('keterangan').value.trim();
            const jumlah = parseFloat(document.getElementById('jumlah').value);

            if (!keterangan || isNaN(jumlah) || jumlah <= 0) {
                alert('Isi keterangan dan nominal dengan benar!');
                return;
            }

            try {
                await addDoc(collection(db, "transaksi"), {
                    user: currentUserEmail,
                    keterangan: keterangan,
                    jumlah: jumlah,
                    tipe: tipe,
                    tanggal: new Date()
                });

                document.getElementById('keterangan').value = '';
                document.getElementById('jumlah').value = '';
                muatData();
            } catch (error) {
                alert('Gagal menyimpan: ' + error.message);
            }
        }

        // Hapus Transaksi
        window.hapusTransaksi = async function(id) {
            if (confirm("Hapus data ini?")) {
                try {
                    await deleteDoc(doc(db, "transaksi", id));
                    muatData();
                } catch (error) {
                    alert('Gagal menghapus: ' + error.message);
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 font-sans text-slate-800 flex justify-center items-center min-h-screen">

    <div class="w-full max-w-md bg-white min-h-screen sm:min-h-[650px] sm:rounded-2xl shadow-2xl flex flex-col justify-between overflow-hidden">
        
        <!-- HALAMAN LOGIN -->
        <div id="login-screen" class="p-8 flex flex-col justify-center flex-1">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-slate-800">Keuangan Pribadi</h1>
                <p class="text-xs text-slate-500 mt-1">Silakan login untuk mengakses data permanen Anda.</p>
            </div>

            <!-- Login Manual -->
            <div class="space-y-3 mb-6">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">USERNAME</label>
                    <input type="text" id="username-inp" placeholder="vzqaajoko" class="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-800">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">PASSWORD</label>
                    <input type="password" id="pass-inp" placeholder="1" class="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-800">
                </div>
                <button onclick="loginManual()" class="w-full bg-slate-900 text-white text-sm font-semibold py-2.5 rounded-lg hover:bg-slate-800 transition">Login Manual</button>
            </div>

            <div class="relative flex py-2 items-center mb-6">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-4 text-xs text-slate-400">ATAU</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <!-- Login Google -->
            <button onclick="loginGoogle()" class="w-full border border-slate-300 text-slate-700 text-sm font-semibold py-2.5 rounded-lg hover:bg-slate-50 transition flex items-center justify-center gap-2">
                <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                Login dengan Akun Google
            </button>
        </div>

        <!-- HALAMAN UTAMA APLIKASI -->
        <div id="app-screen" class="hidden flex flex-col flex-1 justify-between">
            
            <div class="bg-slate-900 text-white p-6 rounded-b-3xl shadow-md">
                <div class="flex justify-between items-center mb-2">
                    <span id="user-info" class="text-xs text-slate-400 truncate max-w-[200px]"></span>
                    <button onclick="logoutApp()" class="text-xs text-rose-400 hover:underline">Logout</button>
                </div>
                <h1 class="text-sm font-medium opacity-80">Saldo Permanen Anda</h1>
                <h2 id="total-saldo" class="text-3xl font-bold mt-1">Rp 0</h2>
            </div>

            <div class="p-6 flex-1 overflow-y-auto">
                <h3 class="font-semibold text-slate-700 mb-3 text-sm">Tambah Transaksi</h3>
                
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6">
                    <div class="mb-3">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">KETERANGAN</label>
                        <input type="text" id="keterangan" placeholder="Contoh: Gaji, Tabungan" class="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900">
                    </div>
                    <div class="mb-3">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">JUMLAH (RP)</label>
                        <input type="number" id="jumlah" placeholder="50000" class="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900">
                    </div>
                    <div class="flex gap-2">
                        <button onclick="tambahTransaksi('masuk')" class="flex-1 bg-emerald-600 text-white text-xs font-semibold py-2 rounded-lg hover:bg-emerald-700 transition">Pemasukan</button>
                        <button onclick="tambahTransaksi('keluar')" class="flex-1 bg-rose-600 text-white text-xs font-semibold py-2 rounded-lg hover:bg-rose-700 transition">Pengeluaran</button>
                    </div>
                </div>

                <h3 class="font-semibold text-slate-700 mb-3 text-sm">Riwayat Transaksi Cloud</h3>
                <div id="riwayat-list" class="space-y-2"></div>
            </div>

            <div class="p-4 text-center text-xs text-slate-400 border-t">
                Sistem Keamanan Aktif &bull; Data Cloud Permanen
            </div>

        </div>

    </div>

</body>
</html>

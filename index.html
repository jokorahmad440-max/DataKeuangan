<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dompet Digital Profesional</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --container-bg: #ffffff;
            --text-color: #333333;
            --input-bg: #ffffff;
            --input-border: #ccc;
            --history-border: #eee;
        }

        .dark-mode {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #ffffff;
            --input-bg: #2d2d2d;
            --input-border: #444;
            --history-border: #333;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: var(--container-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: background 0.3s;
        }
        h2 { text-align: center; margin-top: 0; }
        .saldo-box {
            background: #007bff;
            color: white;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-color);
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-danger {
            background-color: #dc3545;
            padding: 4px 8px;
            font-size: 12px;
            width: auto;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 13px;
            border-bottom: 1px solid var(--history-border);
            padding-bottom: 10px;
        }
        .nav-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        .nav-tabs button {
            flex: 1;
            padding: 8px;
            font-size: 13px;
            background-color: #555;
        }
        .nav-tabs button.active {
            background-color: #007bff;
        }
        .history-list {
            margin-top: 20px;
            max-height: 180px;
            overflow-y: auto;
            border-top: 1px solid var(--history-border);
            padding-top: 10px;
        }
        .history-item {
            font-size: 14px;
            padding: 8px 0;
            border-bottom: 1px solid var(--history-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hidden { display: none !important; }
        .version-box {
            background: rgba(0, 123, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- BAGIAN LOGIN -->
    <div id="loginSection">
        <h2>Login Dompet</h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="inputUser" placeholder="Masukkan username">
        </div>
        <div class="form-group">
            <label>PIN</label>
            <input type="password" id="inputPin" maxlength="4" placeholder="Masukkan PIN">
        </div>
        <button onclick="login()">Masuk</button>
    </div>

    <!-- BAGIAN APLIKASI UTAMA -->
    <div id="appSection" class="hidden">
        <div class="top-bar">
            <span><b>vzqaajoko</b></span>
            <div>
                <button onclick="toggleTheme()" class="btn-secondary" style="padding: 4px 8px; font-size: 12px; width: auto;">🌙/☀️ Tema</button>
                <button onclick="logout()" class="btn-danger" style="padding: 4px 8px; font-size: 12px;">Keluar</button>
            </div>
        </div>

        <h2>Dompet Digital</h2>
        
        <div class="saldo-box" id="displaySaldo">Rp 0</div>

        <!-- Tombol Pemisah Versi 1 & Versi 2 -->
        <div class="nav-tabs">
            <button id="btnVer1" class="active" onclick="pilihVersi(1)">Versi 1 (Fluktuasi)</button>
            <button id="btnVer2" onclick="pilihVersi(2)">Versi 2 (Masuk/Keluar)</button>
        </div>

        <!-- TAMPILAN VERSI 1: FLUKTUASI -->
        <div id="versi1Box" class="version-box">
            📊 <b>Analisis Fluktuasi:</b> <span id="infoFluktuasi">Stabil</span>
        </div>

        <!-- TAMPILAN VERSI 2: RINGKASAN MASUK/KELUAR -->
        <div id="versi2Box" class="version-box hidden">
            📥 Masuk: <span id="totalMasuk" style="color: green; font-weight: bold;">Rp 0</span><br>
            📤 Keluar: <span id="totalKeluar" style="color: red; font-weight: bold;">Rp 0</span>
        </div>

        <!-- FORM TRANSAKSI -->
        <div class="form-group">
            <label>Keterangan</label>
            <input type="text" id="inputKeterangan" placeholder="Contoh: Gaji / Belanja">
        </div>
        <div class="form-group">
            <label>Nominal (Rp)</label>
            <input type="number" id="inputNominal" placeholder="Contoh: 50000">
        </div>
        <div class="form-group">
            <label>Tipe Transaksi</label>
            <select id="inputTipe">
                <option value="in">Pemasukan (+)</option>
                <option value="out">Pengeluaran (-)</option>
            </select>
        </div>
        <button onclick="tambahTransaksi()">Simpan Transaksi</button>

        <!-- RIWAYAT TRANSAKSI -->
        <div class="history-list" id="historyList">
            <div style="color: #888; text-align: center; font-size: 13px;">Belum ada transaksi</div>
        </div>
    </div>
</div>

<script>
    // Pengaman Anti-Inspect & Klik Kanan
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) {
            e.preventDefault();
            return false;
        }
    });

    const STORAGE_KEY = 'dompet_vzqaajoko_data_v2';
    const THEME_KEY = 'dompet_theme_mode';
    const LOGIN_KEY = 'dompet_is_logged_in';

    let appData = {
        saldo: 0,
        riwayat: []
    };

    // Cek Status Login, Tema, & Data saat Halaman Dimuat
    window.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem(THEME_KEY);
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
        }

        const isLoggedIn = localStorage.getItem(LOGIN_KEY);
        if (isLoggedIn === 'true') {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
        }

        const dataLocal = localStorage.getItem(STORAGE_KEY);
        if (dataLocal) {
            appData = JSON.parse(dataLocal);
        }
        updateUI();
    });

    function login() {
        const user = document.getElementById('inputUser').value.trim();
        const pin = document.getElementById('inputPin').value.trim();

        if (user === 'vzqaajoko' && pin === '0000') {
            localStorage.setItem(LOGIN_KEY, 'true');
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            updateUI();
        } else {
            alert('Username atau PIN salah! Gunakan vzqaajoko dan 0000');
        }
    }

    function logout() {
        localStorage.removeItem(LOGIN_KEY);
        document.getElementById('appSection').classList.add('hidden');
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('inputUser').value = '';
        document.getElementById('inputPin').value = '';
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
    }

    function pilihVersi(v) {
        const btn1 = document.getElementById('btnVer1');
        const btn2 = document.getElementById('btnVer2');
        const box1 = document.getElementById('versi1Box');
        const box2 = document.getElementById('versi2Box');

        if (v === 1) {
            btn1.classList.add('active');
            btn2.classList.remove('active');
            box1.classList.remove('hidden');
            box2.classList.add('hidden');
        } else {
            btn2.classList.add('active');
            btn1.classList.remove('active');
            box2.classList.remove('hidden');
            box1.classList.add('hidden');
        }
    }

    function tambahTransaksi() {
        const ket = document.getElementById('inputKeterangan').value.trim() || 'Transaksi';
        const nom = parseFloat(document.getElementById('inputNominal').value);
        const tipe = document.getElementById('inputTipe').value;

        if (isNaN(nom) || nom <= 0) {
            alert('Masukkan nominal yang valid!');
            return;
        }

        if (tipe === 'out' && nom > appData.saldo) {
            alert('Saldo tidak mencukupi!');
            return;
        }

        if (tipe === 'in') {
            appData.saldo += nom;
        } else {
            appData.saldo -= nom;
        }

        appData.riwayat.unshift({
            id: Date.now(),
            keterangan: ket,
            nominal: nom,
            tipe: tipe
        });

        simpanDanUpdate();
        
        document.getElementById('inputKeterangan').value = '';
        document.getElementById('inputNominal').value = '';
    }

    function hapusTransaksi(id) {
        const index = appData.riwayat.findIndex(item => item.id === id);
        if (index !== -1) {
            const item = appData.riwayat[index];
            if (item.tipe === 'in') {
                appData.saldo -= item.nominal;
            } else {
                appData.saldo += item.nominal;
            }
            appData.riwayat.splice(index, 1);
            simpanDanUpdate();
        }
    }

    function simpanDanUpdate() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        updateUI();
    }

    function updateUI() {
        document.getElementById('displaySaldo').innerText = new Intl.NumberFormat('id-ID', {
            style: 'currency', currency: 'IDR', maximumFractionDigits: 0
        }).format(appData.saldo);

        let totalIn = 0;
        let totalOut = 0;
        appData.riwayat.forEach(item => {
            if (item.tipe === 'in') totalIn += item.nominal;
            else totalOut += item.nominal;
        });

        document.getElementById('totalMasuk').innerText = new Intl.NumberFormat('id-ID', {style: 'currency', currency: 'IDR', maximumFractionDigits: 0}).format(totalIn);
        document.getElementById('totalKeluar').innerText = new Intl.NumberFormat('id-ID', {style: 'currency', currency: 'IDR', maximumFractionDigits: 0}).format(totalOut);

        let fluktuasiText = "Stabil ➡️";
        if (totalIn > totalOut) fluktuasiText = "Naik / Surplus 📈";
        else if (totalOut > totalIn) fluktuasiText = "Menurun / Defisit 📉";
        document.getElementById('infoFluktuasi').innerText = fluktuasiText;

        const listContainer = document.getElementById('historyList');
        listContainer.innerHTML = '';

        if (appData.riwayat.length === 0) {
            listContainer.innerHTML = '<div style="color: #888; text-align: center; font-size: 13px;">Belum ada transaksi</div>';
            return;
        }

        appData.riwayat.forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            const tanda = item.tipe === 'in' ? '+' : '-';
            const warna = item.tipe === 'in' ? 'color: green;' : 'color: red;';
            const nomFmt = new Intl.NumberFormat('id-ID').format(item.nominal);

            div.innerHTML = `
                <span><b>${item.keterangan}</b><br><small style="${warna}">${tanda} Rp ${nomFmt}</small></span>
                <button class="btn-danger" onclick="hapusTransaksi(${item.id})">Hapus</button>
            `;
            listContainer.appendChild(div);
        });
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underworld Digital Wallet</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --text-color: #e0e0e0;
            --accent-color: #ff0033;
            --accent-hover: #cc0029;
            --border-color: #262626;
            --input-bg: #1f1f1f;
        }

        .light-mode {
            --bg-color: #f4f4f4;
            --card-bg: #ffffff;
            --text-color: #222222;
            --accent-color: #d9002b;
            --accent-hover: #b30024;
            --border-color: #dddddd;
            --input-bg: #eaeaea;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h2 {
            font-size: 1.4rem;
            letter-spacing: 1px;
            color: var(--accent-color);
        }

        .btn-theme {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-theme:hover {
            border-color: var(--accent-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: var(--text-color);
            opacity: 0.8;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.95rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .balance-card {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .balance-card h3 {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .balance-card .amount {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .menu-btn {
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
        }

        .menu-btn:hover {
            border-color: var(--accent-color);
        }

        .error-msg {
            color: var(--accent-color);
            font-size: 0.8rem;
            margin-top: 5px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            font-size: 0.85rem;
            color: var(--accent-color);
            cursor: pointer;
            text-decoration: none;
        }

        .backup-section {
            margin-top: 15px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h2>UNDERWORLD</h2>
            <button class="btn-theme" onclick="toggleTheme()">Mode Terang/Gelap</button>
        </div>

        <!-- HALAMAN LOGIN -->
        <div id="loginPage">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUser" class="form-control" placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <label>PIN</label>
                <input type="password" id="loginPin" class="form-control" placeholder="••••">
            </div>
            <button class="btn" onclick="handleLogin()">Masuk Sindikat</button>
            <div id="loginError" class="error-msg"></div>
        </div>

        <!-- HALAMAN UTAMA -->
        <div id="mainPage" class="hidden">
            <div class="balance-card">
                <h3>Saldo Tersedia</h3>
                <div class="amount" id="displayBalance">Rp 5.000.000</div>
            </div>

            <div class="menu-grid">
                <div class="menu-btn" onclick="showPage('transferPage')">Kirim Dana</div>
                <div class="menu-btn" onclick="showPage('historyPage')">Riwayat</div>
                <div class="menu-btn" onclick="showPage('statsPage')">Grafik & Rekap</div>
                <div class="menu-btn" onclick="logout()">Keluar</div>
            </div>

            <div class="backup-section">
                <button class="btn-theme" style="flex:1;" onclick="exportData()">Export Data</button>
                <button class="btn-theme" style="flex:1;" onclick="importDataPrompt()">Import Data</button>
            </div>
        </div>

        <!-- HALAMAN TRANSFER -->
        <div id="transferPage" class="hidden">
            <a class="back-link" onclick="showPage('mainPage')">&larr; Kembali</a>
            <h3 style="margin-bottom: 15px; font-size: 1.1rem;">Kirim Dana</h3>
            <div class="form-group">
                <label>Tujuan (Username/Rekening)</label>
                <input type="text" id="destAccount" class="form-control" placeholder="Nama target">
            </div>
            <div class="form-group">
                <label>Nominal (Rp)</label>
                <input type="number" id="transferAmount" class="form-control" placeholder="0">
            </div>
            <button class="btn" onclick="executeTransfer()">Kirim Sekarang</button>
            <div id="transferError" class="error-msg"></div>
        </div>

        <!-- HALAMAN RIWAYAT -->
        <div id="historyPage" class="hidden">
            <a class="back-link" onclick="showPage('mainPage')">&larr; Kembali</a>
            <h3 style="margin-bottom: 15px; font-size: 1.1rem;">Riwayat Transaksi</h3>
            <div id="historyList" style="font-size: 0.85rem; max-height: 200px; overflow-y: auto;">
                <!-- Dinamis -->
            </div>
        </div>

        <!-- HALAMAN GRAFIK & REKAP -->
        <div id="statsPage" class="hidden">
            <a class="back-link" onclick="showPage('mainPage')">&larr; Kembali</a>
            <h3 style="margin-bottom: 15px; font-size: 1.1rem;">Statistik Keuangan</h3>
            <div class="balance-card">
                <h3>Pengeluaran Bulan Ini</h3>
                <div class="amount" id="monthlyExpense" style="font-size: 1.4rem;">Rp 0</div>
            </div>
        </div>
    </div>

    <script>
        // State Aplikasi
        let state = {
            balance: 5000000,
            history: [],
            isLoggedIn: false
        };

        // Load data dari LocalStorage
        function loadData() {
            const saved = localStorage.getItem('underworld_wallet');
            if (saved) {
                state = JSON.parse(saved);
            }
        }

        function saveData() {
            localStorage.setItem('underworld_wallet', JSON.stringify(state));
        }

        loadData();

        if (state.isLoggedIn) {
            showPage('mainPage');
            updateUI();
        }

        function handleLogin() {
            const user = document.getElementById('loginUser').value;
            const pin = document.getElementById('loginPin').value;
            const errorDiv = document.getElementById('loginError');

            // Kredensial diatur: username vzqaajoko dan PIN 1
            if (user === "vzqaajoko" && pin === "1") {
                state.isLoggedIn = true;
                saveData();
                showPage('mainPage');
                updateUI();
                errorDiv.innerText = "";
            } else {
                errorDiv.innerText = "Username atau PIN salah!";
            }
        }

        function logout() {
            state.isLoggedIn = false;
            saveData();
            showPage('loginPage');
        }

        function showPage(pageId) {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainPage').classList.add('hidden');
            document.getElementById('transferPage').classList.add('hidden');
            document.getElementById('historyPage').classList.add('hidden');
            document.getElementById('statsPage').classList.add('hidden');

            document.getElementById(pageId).classList.remove('hidden');
            if (pageId === 'historyPage') renderHistory();
            if (pageId === 'statsPage') renderStats();
        }

        function updateUI() {
            document.getElementById('displayBalance').innerText = formatRupiah(state.balance);
        }

        function executeTransfer() {
            const dest = document.getElementById('destAccount').value;
            const amount = parseInt(document.getElementById('transferAmount').value);
            const errorDiv = document.getElementById('transferError');

            if (!dest || !amount || amount <= 0) {
                errorDiv.innerText = "Mohon isi data dengan benar!";
                return;
            }

            if (amount > state.balance) {
                errorDiv.innerText = "Saldo tidak mencukupi!";
                return;
            }

            state.balance -= amount;
            state.history.unshift({
                desc: `Kirim ke ${dest}`,
                amount: -amount,
                date: new Date().toLocaleDateString('id-ID')
            });

            saveData();
            updateUI();
            errorDiv.innerText = "";
            alert("Transfer Berhasil!");
            showPage('mainPage');
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            if (state.history.length === 0) {
                list.innerHTML = "<p style='opacity:0.6; text-align:center;'>Belum ada transaksi.</p>";
                return;
            }
            list.innerHTML = state.history.map(item => `
                <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border-color);">
                    <span>${item.desc} <br><small style="opacity:0.5;">${item.date}</small></span>
                    <span style="color: ${item.amount < 0 ? 'var(--accent-color)' : '#00cc66'}">${formatRupiah(item.amount)}</span>
                </div>
            `).join('');
        }

        function renderStats() {
            let totalExpense = state.history
                .filter(item => item.amount < 0)
                .reduce((acc, curr) => acc + Math.abs(curr.amount), 0);
            document.getElementById('monthlyExpense').innerText = formatRupiah(totalExpense);
        }

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "underworld_backup.json");
            dlAnchorElem.click();
        }

        function importDataPrompt() {
            const jsonStr = prompt("Paste data JSON backup di sini:");
            if (jsonStr) {
                try {
                    state = JSON.parse(jsonStr);
                    saveData();
                    updateUI();
                    alert("Data berhasil dipulihkan!");
                    showPage('mainPage');
                } catch (e) {
                    alert("Format data tidak valid!");
                }
            }
        }
    </script>
</body>
</html>

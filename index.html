<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dompet Digital Profesional</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0f172a;
            --input-border: #334155;
            --history-border: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
        }

        .light-mode {
            --bg-color: #f1f5f9;
            --container-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --input-bg: #f8fafc;
            --input-border: #cbd5e1;
            --history-border: #e2e8f0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #059669;
            --danger: #dc2626;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
            position: relative;
        }

        /* Menu Tombol Versi di Kiri Luar */
        .external-version-menu {
            position: absolute;
            top: 40px;
            left: 40px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }

        .btn-external-version {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            text-align: center;
            opacity: 0.5;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-external-version:hover {
            opacity: 0.8;
            transform: translateY(-2px);
        }

        .btn-external-version.active {
            opacity: 1;
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.5);
        }

        /* Container Utama Dompet */
        .container {
            width: 100%;
            max-width: 440px;
            background: var(--container-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            transition: background 0.3s ease, transform 0.3s ease;
        }

        h2 { 
            text-align: center; 
            margin-top: 0; 
            font-size: 20px; 
            letter-spacing: 0.5px;
        }

        .saldo-box {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label { 
            display: block; 
            margin-bottom: 6px; 
            font-size: 13px; 
            font-weight: 600; 
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button.btn-action {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }

        button.btn-action:hover { opacity: 0.95; transform: translateY(-1px); }
        button.btn-action:active { transform: translateY(0); }

        .btn-secondary {
            background-color: var(--input-border);
            color: var(--text-color);
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
            border-bottom: 1px solid var(--history-border);
            padding-bottom: 12px;
        }

        .history-list {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid var(--history-border);
            padding-top: 12px;
        }

        .history-item {
            font-size: 14px;
            padding: 10px 4px;
            border-bottom: 1px solid var(--history-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hidden { display: none !important; }
        
        /* Kotak Grafik Estetik Versi 1 */
        .chart-box {
            background: rgba(59, 130, 246, 0.05);
            border: 1px solid var(--input-border);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        svg.flame-chart {
            width: 100%;
            height: 120px;
            overflow: visible;
        }
    </style>
</head>
<body>

    <!-- Menu Versi di Luar Kiri -->
    <div class="external-version-menu" id="externalMenu">
        <button id="btnVer1" class="btn-external-version active" onclick="pilihVersi(1)">Versi 1</button>
        <button id="btnVer2" class="btn-external-version" onclick="pilihVersi(2)">Versi 2</button>
    </div>

<div class="container">
    <!-- BAGIAN LOGIN -->
    <div id="loginSection">
        <h2>Login Dompet</h2>
        <div class="form-group" style="margin-top: 20px;">
            <label>Username</label>
            <input type="text" id="inputUser" placeholder="Masukkan username">
        </div>
        <div class="form-group">
            <label>PIN</label>
            <input type="password" id="inputPin" maxlength="4" placeholder="Masukkan PIN">
        </div>
        <button class="btn-action" onclick="login()" style="margin-top: 10px;">Masuk</button>
    </div>

    <!-- BAGIAN APLIKASI UTAMA -->
    <div id="appSection" class="hidden">
        <div class="top-bar">
            <span>👤 <b>vzqaajoko</b></span>
            <div style="display: flex; gap: 6px;">
                <button onclick="toggleTheme()" class="btn-secondary">🌙/☀️ Tema</button>
                <button onclick="logout()" class="btn-danger">Keluar</button>
            </div>
        </div>

        <h2>Dompet Digital</h2>
        
        <div class="saldo-box" id="displaySaldo">Rp 0</div>

        <!-- TAMPILAN VERSI 1: GRAFIK FLUKTUASI -->
        <div id="versi1Content">
            <div class="chart-box">
                <p style="margin: 0 0 12px 0; font-size: 13px; font-weight: 600; color: var(--text-muted);">📈 Grafik Fluktuasi Keuangan</p>
                <svg class="flame-chart" id="fluctuationSvg" viewBox="0 0 300 100">
                    <!-- Digambar dinamis via JavaScript -->
                </svg>
                <p id="flunctuationText" style="margin: 10px 0 0 0; font-size: 12px; color: var(--text-muted);">Belum ada fluktuasi data</p>
            </div>
        </div>

        <!-- TAMPILAN VERSI 2: MENU INPUT -->
        <div id="versi2Content" class="hidden">
            <div class="form-group">
                <label>Keterangan</label>
                <input type="text" id="inputKeterangan" placeholder="Contoh: Gaji / Belanja">
            </div>
            <div class="form-group">
                <label>Nominal (Rp)</label>
                <input type="number" id="inputNominal" placeholder="Contoh: 50000">
            </div>
            <div class="form-group">
                <label>Tipe Transaksi</label>
                <select id="inputTipe">
                    <option value="in">Pemasukan (+)</option>
                    <option value="out">Pengeluaran (-)</option>
                </select>
            </div>
            <button class="btn-action" onclick="tambahTransaksi()">Simpan Transaksi</button>
        </div>

        <!-- RIWAYAT TRANSAKSI (Hanya di Versi 2) -->
        <div class="history-list hidden" id="historyListContainer">
            <div id="historyList">
                <div style="color: var(--text-muted); text-align: center; font-size: 13px;">Belum ada transaksi</div>
            </div>
        </div>
    </div>
</div>

<script>
    // Pengaman Anti-Inspect & Klik Kanan
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'U')) {
            e.preventDefault();
            return false;
        }
    });

    const STORAGE_KEY = 'dompet_vzqaajoko_permanent_data_v4';
    const THEME_KEY = 'dompet_theme_mode_v2';
    const LOGIN_KEY = 'dompet_is_logged_in_v2';

    let appData = {
        saldo: 0,
        riwayat: []
    };

    window.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem(THEME_KEY);
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
        }

        const isLoggedIn = localStorage.getItem(LOGIN_KEY);
        if (isLoggedIn === 'true') {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
        }

        muatDataDariStorage();
        updateUI();
    });

    function muatDataDariStorage() {
        try {
            const dataLocal = localStorage.getItem(STORAGE_KEY);
            if (dataLocal) {
                const parsed = JSON.parse(dataLocal);
                appData = {
                    saldo: typeof parsed.saldo === 'number' ? parsed.saldo : 0,
                    riwayat: Array.isArray(parsed.riwayat) ? parsed.riwayat : []
                };
            }
        } catch (err) {
            appData = { saldo: 0, riwayat: [] };
        }
    }

    function login() {
        const user = document.getElementById('inputUser').value.trim();
        const pin = document.getElementById('inputPin').value.trim();

        if (user === 'vzqaajoko' && pin === '0000') {
            localStorage.setItem(LOGIN_KEY, 'true');
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            muatDataDariStorage();
            updateUI();
        } else {
            alert('Username atau PIN salah! Gunakan vzqaajoko dan 0000');
        }
    }

    function logout() {
        localStorage.removeItem(LOGIN_KEY);
        document.getElementById('appSection').classList.add('hidden');
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('inputUser').value = '';
        document.getElementById('inputPin').value = '';
    }

    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        localStorage.setItem(THEME_KEY, isLight ? 'light' : 'dark');
    }

    function pilihVersi(v) {
        const btn1 = document.getElementById('btnVer1');
        const btn2 = document.getElementById('btnVer2');
        const ver1Content = document.getElementById('versi1Content');
        const ver2Content = document.getElementById('versi2Content');
        const historyContainer = document.getElementById('historyListContainer');

        if (v === 1) {
            btn1.classList.add('active');
            btn2.classList.remove('active');
            ver1Content.classList.remove('hidden');
            ver2Content.classList.add('hidden');
            historyContainer.classList.add('hidden');
        } else {
            btn2.classList.add('active');
            btn1.classList.remove('active');
            ver2Content.classList.remove('hidden');
            ver1Content.classList.add('hidden');
            historyContainer.classList.remove('hidden');
        }
    }

    function tambahTransaksi() {
        const ket = document.getElementById('inputKeterangan').value.trim() || 'Transaksi';
        const nom = parseFloat(document.getElementById('inputNominal').value);
        const tipe = document.getElementById('inputTipe').value;

        if (isNaN(nom) || nom <= 0) {
            alert('Masukkan nominal yang valid!');
            return;
        }

        muatDataDariStorage();

        if (tipe === 'out' && nom > appData.saldo) {
            alert('Saldo tidak mencukupi!');
            return;
        }

        if (tipe === 'in') {
            appData.saldo += nom;
        } else {
            appData.saldo -= nom;
        }

        appData.riwayat.unshift({
            id: Date.now(),
            keterangan: ket,
            nominal: nom,
            tipe: tipe
        });

        simpanData();
        
        document.getElementById('inputKeterangan').value = '';
        document.getElementById('inputNominal').value = '';
    }

    function hapusTransaksi(id) {
        muatDataDariStorage();
        const index = appData.riwayat.findIndex(item => item.id === id);
        if (index !== -1) {
            const item = appData.riwayat[index];
            if (item.tipe === 'in') {
                appData.saldo -= item.nominal;
            } else {
                appData.saldo += item.nominal;
            }
            appData.riwayat.splice(index, 1);
            simpanData();
        }
    }

    function simpanData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        updateUI();
    }

    function updateUI() {
        muatDataDariStorage();

        document.getElementById('displaySaldo').innerText = new Intl.NumberFormat('id-ID', {
            style: 'currency', currency: 'IDR', maximumFractionDigits: 0
        }).format(appData.saldo);

        renderFluktuasiChart();

        const listContainer = document.getElementById('historyList');
        listContainer.innerHTML = '';

        if (!appData.riwayat || appData.riwayat.length === 0) {
            listContainer.innerHTML = '<div style="color: var(--text-muted); text-align: center; font-size: 13px;">Belum ada transaksi</div>';
            return;
        }

        appData.riwayat.forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            const tanda = item.tipe === 'in' ? '+' : '-';
            const warna = item.tipe === 'in' ? 'color: var(--success);' : 'color: var(--danger);';
            const nomFmt = new Intl.NumberFormat('id-ID').format(item.nominal);

            div.innerHTML = `
                <span><b>${item.keterangan}</b><br><small style="${warna}; font-weight: 600;">${tanda} Rp ${nomFmt}</small></span>
                <button class="btn-danger" onclick="hapusTransaksi(${item.id})">Hapus</button>
            `;
            listContainer.appendChild(div);
        });
    }

    function renderFluktuasiChart() {
        const svg = document.getElementById('fluctuationSvg');
        const textInfo = document.getElementById('flunctuationText');
        svg.innerHTML = '';

        if (!appData.riwayat || appData.riwayat.length === 0) {
            textInfo.innerText = "Belum ada fluktuasi data";
            return;
        }

        let currentS = appData.saldo;
        for(let i = appData.riwayat.length - 1; i >= 0; i--) {
            let tr = appData.riwayat[i];
            if(tr.tipe === 'in') currentS -= tr.nominal;
            else currentS += tr.nominal;
        }
        
        let traceSaldo = currentS;
        let valList = [traceSaldo];
        appData.riwayat.slice().reverse().forEach(tr => {
            if(tr.tipe === 'in') traceSaldo += tr.nominal;
            else traceSaldo -= tr.nominal;
            valList.push(traceSaldo);
        });

        let minV = Math.min(...valList);
        let maxV = Math.max(...valList);
        let rangeV = maxV - minV || 1;

        let width = 300;
        let height = 80;
        let stepX = width / Math.max(valList.length - 1, 1);

        let ptsString = "";
        let points = [];
        valList.forEach((val, idx) => {
            let cx = idx * stepX;
            let cy = height - ((val - minV) / rangeV) * height + 10;
            points.push({x: cx, y: cy});
            ptsString += `${cx},${cy} `;
        });

        // Buat Area Gradient di Bawah Garis
        let areaPoints = `0,100 ${ptsString} ${width},100`;
        let polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        polygon.setAttribute('points', areaPoints);
        polygon.setAttribute('fill', 'rgba(59, 130, 246, 0.15)');
        svg.appendChild(polygon);

        // Garis Grafik Utama
        let polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
        polyline.setAttribute('points', ptsString);
        polyline.setAttribute('fill', 'none');
        polyline.setAttribute('stroke', '#3b82f6');
        polyline.setAttribute('stroke-width', '3');
        polyline.setAttribute('stroke-linecap', 'round');
        polyline.setAttribute('stroke-linejoin', 'round');
        svg.appendChild(polyline);

        // Titik-titik Data pada Grafik
        points.forEach(pt => {
            let circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', pt.x);
            circle.setAttribute('cy', pt.y);
            circle.setAttribute('r', '5');
            circle.setAttribute('fill', '#3b82f6');
            circle.setAttribute('stroke', '#ffffff');
            circle.setAttribute('stroke-width', '2');
            svg.appendChild(circle);
        });

        textInfo.innerText = `Fluktuasi Aktif (${valList.length} Titik Perubahan)`;
    }
</script>

</body>
</html>
